<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120c1b" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BoardState</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./assets/icon-source/Copilot_20260525_040326.png" />
    <link rel="preload" as="image" href="./assets/boardstate-loading-dragon.jpg" type="image/jpeg" fetchpriority="high" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05030a;
      }

      #boardstate-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        background-color: #05030a;
      }

      body:not(.boardstate-app-ready) #app {
        visibility: hidden;
      }
    </style>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="boardstate-loader" class="boardstate-loading-screen" role="status" aria-live="polite" aria-label="BoardState loading">
      <div class="loading-arcane-frame" aria-hidden="true"></div>
      <div class="loading-dragon-glow" aria-hidden="true"></div>
      <div class="loading-wisp wisp-one" aria-hidden="true"></div>
      <div class="loading-wisp wisp-two" aria-hidden="true"></div>
      <div class="loading-wisp wisp-three" aria-hidden="true"></div>
      <section class="loading-copy">
        <h1>Board<span aria-hidden="true">✦</span>State</h1>
        <p data-loading-status>Awakening the board...</p>
      </section>
      <section class="loading-bar-shell" aria-label="Loading progress">
        <div class="loading-bar-frame">
          <div class="loading-bar-fill" data-loading-fill></div>
        </div>
        <span class="loading-percent" data-loading-percent>0%</span>
      </section>
      <section class="loading-recovery" data-loading-actions hidden>
        <p data-loading-details>Startup is taking longer than expected.</p>
        <div>
          <button type="button" data-loading-continue>Continue anyway</button>
          <button type="button" data-loading-reset>Reset stuck state</button>
          <button type="button" data-loading-fresh>Open fresh session</button>
        </div>
      </section>
    </div>
    <section id="boardstate-landscape-gate" class="boardstate-landscape-gate" role="alertdialog" aria-modal="true" aria-labelledby="boardstate-landscape-title" aria-describedby="boardstate-landscape-copy" hidden>
      <div class="landscape-gate-card">
        <span class="landscape-gate-icon" aria-hidden="true"></span>
        <p class="eyebrow">Landscape Required</p>
        <h1 id="boardstate-landscape-title">Turn your device sideways</h1>
        <p id="boardstate-landscape-copy">BoardState gameplay is designed exclusively for a horizontal table. Your game is safe and will appear as soon as the device is in landscape.</p>
        <button type="button" data-retry-landscape-lock>Try Landscape</button>
      </div>
    </section>
    <div id="app" aria-busy="true"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
