import java.io.FileInputStream
import java.util.Properties

plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def configuredKeystorePath = keystoreProperties.getProperty("storeFile", System.getenv("BOARDSTATE_KEYSTORE_FILE"))
def releaseKeystoreFile = configuredKeystorePath ? rootProject.file(configuredKeystorePath) : null
def releaseStorePassword = keystoreProperties.getProperty("storePassword", System.getenv("BOARDSTATE_KEYSTORE_PASSWORD"))
def releaseKeyAlias = keystoreProperties.getProperty("keyAlias", System.getenv("BOARDSTATE_KEY_ALIAS"))
def releaseKeyPassword = keystoreProperties.getProperty("keyPassword", System.getenv("BOARDSTATE_KEY_PASSWORD"))
def hasProductionSigning = releaseKeystoreFile != null &&
    releaseKeystoreFile.exists() &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword
def isWindowsOs = System.getProperty("os.name").toLowerCase().contains("win")
def bundledKeytool = new File(System.getProperty("java.home"), "bin/${isWindowsOs ? 'keytool.exe' : 'keytool'}")
def keytoolExecutablePath = bundledKeytool.exists() ? bundledKeytool.absolutePath : (isWindowsOs ? "keytool.exe" : "keytool")
def uploadCertificatePem = rootProject.file("release/upload_certificate.pem")

tasks.register("verifyReleaseSigning") {
    group = "signing"
    description = "Reports whether the release uses supplied production credentials or the safe Android test key."

    doLast {
        if (hasProductionSigning) {
            logger.lifecycle("Using externally supplied production release signing credentials.")
        } else {
            logger.lifecycle("Production signing credentials are unavailable; release output is test-signed for install validation.")
        }
    }
}

tasks.register("exportReleaseUploadCertificate") {
    group = "signing"
    description = "Exports the upload certificate PEM from the configured release keystore."
    dependsOn("verifyReleaseSigning")
    onlyIf { hasProductionSigning }
    if (hasProductionSigning) {
        outputs.file(uploadCertificatePem)
    }

    doLast {
        uploadCertificatePem.parentFile.mkdirs()
        def exportArgs = [
            "-export",
            "-rfc",
            "-alias", releaseKeyAlias,
            "-keystore", releaseKeystoreFile.absolutePath,
            "-storepass", releaseStorePassword,
            "-file", uploadCertificatePem.absolutePath
        ]

        exec {
            executable keytoolExecutablePath
            args exportArgs
        }

        logger.lifecycle("Exported upload certificate to ${uploadCertificatePem}")
    }
}

android {
    namespace "com.boardstate.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.boardstate.app"
        minSdk 24
        targetSdk 36
        versionCode 51
        versionName "1.44.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasProductionSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasProductionSigning ? signingConfigs.release : signingConfigs.debug
            buildConfigField "String", "SIGNING_STATUS", hasProductionSigning ? '"production"' : '"test-signed"'
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "RELEASE_BUILD", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

tasks.matching { task ->
    task.name in [
        "validateSigningRelease",
        "packageRelease",
        "assembleRelease",
        "bundleRelease"
    ]
}.configureEach {
    dependsOn("verifyReleaseSigning")
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity:1.11.0"
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.core:core-splashscreen:1.2.0"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}
